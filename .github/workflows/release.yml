name: 실행 파일 빌드·배포

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["server/**", "app/**", "tests/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_brokers.py
      - run: python tests/test_server.py
      - run: python tests/test_instance.py

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node tests/ui_smoke.mjs

  build:
    needs: [test, ui]
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: JageumJeonseon-Windows.exe
            sep: ";"
          - os: macos-latest
            name: JageumJeonseon-Mac-AppleSilicon.zip
            sep: ":"
          - os: macos-15-intel
            name: JageumJeonseon-Mac-Intel.zip
            sep: ":"
          - os: ubuntu-latest
            name: JageumJeonseon-Linux
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller==6.10.0
      - run: pyinstaller --onefile --name jageum-jeonseon --add-data "app${{ matrix.sep }}app" server/warroom.py
      - name: 실행 파일 점검 (실제로 켜서 화면·3D 엔진·보안 검사 확인)
        shell: bash
        env: { PYTHONIOENCODING: utf-8 }
        run: |
          bin=dist/jageum-jeonseon; [ -f dist/jageum-jeonseon.exe ] && bin=dist/jageum-jeonseon.exe
          "$bin" --self-test
      - name: 이름 정리 (Mac은 「실행하기」와 함께 zip으로)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            d="pkg/자금전선 작전상황실"; mkdir -p "$d"
            cp dist/jageum-jeonseon "$d/"; cp packaging/mac/실행하기.command packaging/mac/읽어보기.txt "$d/"
            chmod +x "$d/jageum-jeonseon" "$d/실행하기.command"
            ditto -c -k --sequesterRsrc --keepParent "$d" "dist/${{ matrix.name }}"
          else
            src=dist/jageum-jeonseon; [ -f dist/jageum-jeonseon.exe ] && src=dist/jageum-jeonseon.exe
            mv "$src" "dist/${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "dist/${{ matrix.name }}" }

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 읽기 (server/warroom.py 의 VERSION)
        id: v
        run: echo "tag=v$(python3 -c "import re;print(re.search(r'VERSION = \"([^\"]+)\"',open('server/warroom.py',encoding='utf-8').read()).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: 릴리스 안내문 만들기 (어떤 파일을 받는지)
        run: |
          tag="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}"
          sed "s/__VER__/$tag/g" docs/RELEASE_TEMPLATE.md > body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 자금전선 작전상황실 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          files: out/*
          body_path: body.md
          generate_release_notes: true
          make_latest: true
